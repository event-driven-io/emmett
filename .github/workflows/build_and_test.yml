name: Build and test

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/docs/**"
      - "./.github/workflows/build_and_test.yml"

  # run it during pull request
  pull_request:
    paths:
      - "src/**"
      - "!src/docs/**"
      - "./.github/workflows/build_and_test.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

defaults:
  run:
    working-directory: src

jobs:
  build-and-test-code:
    name: Build application code
    # use system defined below in the tests matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ./src/.nvmrc

      - name: Ensure specific npm version
        run: npm install -g npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Check generated Cloudflare Worker types are current
        run: npm run types:cloudflare:check

      - name: Build TS
        run: npm run build:ts

      - name: Run linting (ESlint and Prettier)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run bundle boundaries test
        run: npm run test:bundle

      - name: Test
        run: npm run test

      - name: Run ESM compatibility test
        run: npm run test:compat:esm

      - name: Run browser compatibility test
        run: npm run test:compat:browser

      - name: Run CommonJS library declarations test
        run: npm run test:compat:declarations:commonjs

      - name: Run ESM library declarations test
        run: npm run test:compat:declarations:esm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Bun compatibility test
        run: npm run test:compat:bun
